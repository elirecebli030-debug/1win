[build]
  publish = "public"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/cdaredirect"
  to = "/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/cda/*"
  to = "/index.html"
  status = 200
  force = true

# Bütün API sorğuları üçün (əgər varsa)
[[redirects]]
  from = "/api/*"
  to = "/api/:splat"
  status = 200

# Statik fayllar üçün
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000"
