[build]
  publish = "."

# Bütün 404-ləri ana səhifəyə yönləndir
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Xüsusi olaraq /cdaredirect üçün
[[redirects]]
  from = "/cdaredirect"
  to = "/index.html"
  status = 200

# Bütün səhifələr üçün SPA rule
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  force = true

# Statik fayllar üçün cache
[[headers]]
  for = "/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/static/app/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
